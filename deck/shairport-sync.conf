// Braiins Deck AirPlay speaker (shairport-sync 3.3.9, OpenWrt "mini" build).
// Installed by deck/install.sh; the package's original sample config
// is kept on the Deck at /etc/shairport-sync.conf.orig.

general =
{
	name = "Braiins Deck";
	output_backend = "alsa";
	mdns_backend = "tinysvcmdns";
	port = 5000;
	udp_port_base = 6001;
	udp_port_range = 10;
	// The Deck has a single speaker on a mono amplifier.
	playback_mode = "mono";
	// Headroom against underruns on the Deck's 650 MHz Cortex-A7.
	audio_backend_buffer_desired_length_in_seconds = 0.3;
	// Kept at 0 so the sound stays in step with the video on the iPhone, which
	// holds its picture back by AirPlay's ~2 s delay. A negative offset starts
	// play sooner but puts the sound ahead of the video by as much: -1.0 was
	// measured safe, -1.5 went silent. (The AirPlay Remote bridge makes pausing
	// instant anyway, by muting the speaker.)
	audio_backend_latency_offset_in_seconds = 0.0;
};

sessioncontrol =
{
	// A second iPhone can take over the speaker instead of being refused.
	allow_session_interruption = "yes";
	session_timeout = 20;
};

alsa =
{
	// The Deck's own softvol device, so its system volume still applies,
	// behind AirPlay's own mute switch (alsa-airplay.conf).
	// No mixer_control_name: AirPlay volume is applied in software and never
	// moves the Deck's alarm volume.
	output_device = "airplay";
};

metadata =
{
	// Song title and artist, for a "now playing" Deck widget.
	enabled = "yes";
	include_cover_art = "no";
	socket_address = "127.0.0.1";
	socket_port = 5555;
	socket_msglength = 65000;
};
