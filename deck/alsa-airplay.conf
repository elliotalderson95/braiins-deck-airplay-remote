# AirPlay's own sound output on the Deck: the Deck's normal device ("default",
# so its Master volume still applies) behind a mute switch of its own. The
# AirPlay Remote turns the switch off to silence a pause at once. The Deck's
# "Speaker" switch can't: its amp only follows that switch when a sound starts,
# and AirPlay keeps one sound running through a pause.
#
# Installed by install.sh as /etc/alsa/conf.d/50-airplay.conf. ALSA creates the
# switch the first time AirPlay plays after a boot.

pcm.airplay {
	type softvol
	slave.pcm "default"
	control {
		name "AirPlay Playback Switch"
		card 0
		count 1
	}
	# Two steps make it an on/off switch rather than a volume.
	resolution 2
}
